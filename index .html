<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque de Embalagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FAF9F4;
    --surface:#FFFFFF;
    --surface-2:#F1EEE3;
    --ink:#2A2740;
    --ink-muted:#6E6A80;
    --border:#E3DFD1;
    --accent:#6E4E92;
    --accent-ink:#3D2A54;
    --accent-soft:#EFE7F5;
    --vine:#3E7A3D;
    --vine-soft:#E4F1DE;
    --good:#3E7A3D;
    --good-soft:#E4F1DE;
    --warn:#A8681A;
    --warn-soft:#FBEBD3;
    --critical:#AE3B3B;
    --critical-soft:#FAE1DF;
    --shadow:rgba(43,39,64,0.10);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B1826;
      --surface:#242030;
      --surface-2:#2C2739;
      --ink:#F1EEF7;
      --ink-muted:#B4AEC9;
      --border:#3B3548;
      --accent:#C3A3E3;
      --accent-ink:#F1E6FA;
      --accent-soft:#3B2E4F;
      --vine:#8FC47E;
      --vine-soft:#28381F;
      --good:#86C476;
      --good-soft:#24361F;
      --warn:#E3A857;
      --warn-soft:#3D2D17;
      --critical:#E08585;
      --critical-soft:#3B2222;
      --shadow:rgba(0,0,0,0.4);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1826;
    --surface:#242030;
    --surface-2:#2C2739;
    --ink:#F1EEF7;
    --ink-muted:#B4AEC9;
    --border:#3B3548;
    --accent:#C3A3E3;
    --accent-ink:#F1E6FA;
    --accent-soft:#3B2E4F;
    --vine:#8FC47E;
    --vine-soft:#28381F;
    --good:#86C476;
    --good-soft:#24361F;
    --warn:#E3A857;
    --warn-soft:#3D2D17;
    --critical:#E08585;
    --critical-soft:#3B2222;
    --shadow:rgba(0,0,0,0.4);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, serif;
    text-wrap:balance;
    margin:0;
  }
  .shell{max-width:1180px;margin:0 auto;padding:20px 24px 64px;}

  /* ---------- Header ---------- */
  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:18px;
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0;}
  .brand img{height:34px;width:auto;display:block;}
  .brand .titles{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand .app-name{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;letter-spacing:.2px;}
  .brand .app-sub{font-size:.78rem;color:var(--ink-muted);}
  .sync-pill{
    display:inline-flex;align-items:center;gap:7px;
    font-size:.78rem;color:var(--ink-muted);
    padding:5px 12px;border-radius:999px;background:var(--surface-2);
    border:1px solid var(--border);white-space:nowrap;
  }
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;}
  .sync-pill.local .sync-dot{background:var(--warn);}

  nav.tabs{
    display:flex;gap:4px;flex-wrap:wrap;margin-bottom:22px;
    border-bottom:1px solid var(--border);
  }
  nav.tabs button{
    font-family:'Public Sans',sans-serif;
    font-size:.92rem;font-weight:600;
    color:var(--ink-muted);
    background:none;border:none;cursor:pointer;
    padding:10px 16px;border-bottom:2px solid transparent;
    margin-bottom:-1px;
    border-radius:6px 6px 0 0;
    transition:color .15s ease, background .15s ease;
  }
  nav.tabs button:hover{background:var(--surface-2);color:var(--ink);}
  nav.tabs button.active{color:var(--accent-ink);border-bottom-color:var(--accent);background:var(--accent-soft);}

  /* ---------- Generic building blocks ---------- */
  .no-print{}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px;}
  .kpi{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;box-shadow:0 1px 2px var(--shadow);
    border-left:4px solid var(--accent);
  }
  .kpi.tone-warn{border-left-color:var(--warn);}
  .kpi.tone-critical{border-left-color:var(--critical);}
  .kpi .num{font-family:'Fraunces',serif;font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;}
  .kpi .label{margin-top:6px;font-size:.82rem;color:var(--ink-muted);}

  .panels-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:28px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:0 1px 2px var(--shadow);}
  .panel h3{font-size:1.02rem;margin-bottom:12px;font-weight:600;}
  .alert-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem;}
  .alert-row:last-child{border-bottom:none;}
  .alert-row .meta{color:var(--ink-muted);font-size:.8rem;}
  .empty-msg{color:var(--ink-muted);font-size:.88rem;padding:6px 0;}

  section.tab-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;box-shadow:0 1px 2px var(--shadow);margin-bottom:20px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .section-head h2{font-size:1.25rem;font-weight:600;}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .search-input{
    padding:8px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--ink);font-size:.88rem;min-width:200px;
  }
  .search-input:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .btn{
    font-family:'Public Sans',sans-serif;font-weight:600;font-size:.85rem;
    padding:9px 16px;border-radius:8px;border:1px solid transparent;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-secondary{background:var(--surface-2);color:var(--ink);border-color:var(--border);}
  .btn-secondary:hover{background:var(--border);}
  .btn-ghost{background:none;color:var(--accent-ink);padding:6px 10px;font-size:.82rem;}
  .btn-ghost:hover{background:var(--accent-soft);}
  .btn-danger{background:none;color:var(--critical);padding:6px 10px;font-size:.82rem;}
  .btn-danger:hover{background:var(--critical-soft);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
  table{width:100%;border-collapse:collapse;font-size:.88rem;}
  thead th{
    text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-muted);background:var(--surface-2);padding:10px 12px;font-weight:600;
    white-space:nowrap;
  }
  tbody td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle;}
  tbody tr:hover{background:var(--surface-2);}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;}
  .chip-good{background:var(--good-soft);color:var(--good);}
  .chip-warn{background:var(--warn-soft);color:var(--warn);}
  .chip-critical{background:var(--critical-soft);color:var(--critical);}
  .chip-neutral{background:var(--surface-2);color:var(--ink-muted);}

  /* ---------- Forms / dialogs ---------- */
  dialog{
    border:none;border-radius:14px;padding:0;max-width:480px;width:92vw;
    background:var(--surface);color:var(--ink);box-shadow:0 12px 40px var(--shadow);
  }
  dialog::backdrop{background:rgba(20,16,28,.45);}
  .dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
  .dialog-head h3{font-size:1.1rem;font-weight:600;}
  .dialog-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px;max-height:60vh;overflow-y:auto;}
  .dialog-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:.78rem;font-weight:600;color:var(--ink-muted);}
  .field input,.field select,.field textarea{
    padding:9px 11px;border:1px solid var(--border);border-radius:8px;
    background:var(--bg);color:var(--ink);font-family:inherit;font-size:.9rem;
  }
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.field-row{grid-template-columns:1fr;}}
  .checkbox-field{display:flex;align-items:flex-start;gap:9px;font-size:.86rem;}
  .checkbox-field input{margin-top:3px;}
  .close-x{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--ink-muted);line-height:1;padding:2px 4px;}
  .close-x:hover{color:var(--ink);}

  /* ---------- Ficha ---------- */
  .ficha-back{margin-bottom:14px;}
  .ficha-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px 28px;box-shadow:0 1px 2px var(--shadow);}
  .ficha-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .ficha-title-row h2{font-size:1.35rem;font-weight:600;}
  .ficha-title-row .sub{color:var(--ink-muted);font-size:.85rem;margin-top:2px;}
  .id-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 22px;padding:16px 18px;background:var(--surface-2);border-radius:10px;margin-bottom:20px;}
  @media (max-width:640px){.id-grid{grid-template-columns:repeat(2,1fr);}}
  .id-item .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);margin-bottom:2px;}
  .id-item .v{font-weight:600;font-variant-numeric:tabular-nums;}

  .legal-block{
    border:1px solid var(--border);border-left:3px solid var(--accent);
    background:var(--surface-2);border-radius:0 8px 8px 0;
    padding:14px 18px;font-size:.83rem;color:var(--ink-muted);line-height:1.6;margin-bottom:22px;
  }
  .legal-block strong{color:var(--ink);}

  h3.section-title{font-size:1rem;font-weight:600;margin-bottom:12px;margin-top:26px;}
  .entrega-form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px;padding:16px;background:var(--surface-2);border-radius:10px;}
  .entrega-form .field{min-width:150px;flex:1 1 150px;}
  .entrega-form .field.qtd{max-width:100px;flex:0 0 100px;}
  .entrega-form .btn{flex:none;}

  .declaracao-box{margin-top:24px;padding:18px 20px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);}
  .declaracao-box .checkbox-field{margin-bottom:10px;}
  .declaracao-status{margin-top:10px;font-size:.82rem;color:var(--ink-muted);}

  /* ---------- Auth ---------- */
  .header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .user-badge{display:flex;align-items:center;gap:9px;font-size:.82rem;color:var(--ink-muted);}
  .user-badge .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex:none;}
  .auth-wrap{min-height:60vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:30px 28px;width:100%;max-width:380px;box-shadow:0 4px 24px var(--shadow);}
  .auth-card h2{font-size:1.2rem;text-align:center;font-weight:600;}
  .auth-card .sub{color:var(--ink-muted);font-size:.85rem;text-align:center;margin:6px 0 20px;}
  .auth-card form{display:flex;flex-direction:column;gap:14px;}
  .auth-error{color:var(--critical);font-size:.83rem;background:var(--critical-soft);padding:9px 12px;border-radius:8px;margin-bottom:14px;}
  .auth-hint{font-size:.78rem;color:var(--ink-muted);margin-top:16px;text-align:center;}

  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    .shell{max-width:none;padding:0;}
    .ficha-card{border:none;box-shadow:none;padding:0;}
  }

  /* ---------- Estoque de embalagens (extras) ---------- */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .filters select,.filters input[type=date]{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.88rem;font-family:inherit;}
  .hint{font-size:.8rem;color:var(--ink-muted);}
  .hint-box{font-size:.84rem;color:var(--ink-muted);background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px;line-height:1.55;}
  .hint-box strong{color:var(--ink);}
  .count-input{width:110px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:.9rem;text-align:right;font-variant-numeric:tabular-nums;}
  .count-input.filled{border-color:var(--vine);background:var(--vine-soft);}
  .count-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);min-width:160px;}
  .progress > span{display:block;height:100%;background:var(--vine);}
  .dropzone{border:2px dashed var(--border);border-radius:12px;padding:34px 20px;text-align:center;background:var(--surface-2);cursor:pointer;transition:border-color .15s, background .15s;}
  .dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft);}
  .dropzone .big{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600;margin-bottom:4px;}
  .preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0;}
  .preview-grid .kpi .num{font-size:1.5rem;}
  .pos{color:var(--good);} .neg{color:var(--critical);}
  tr.clickable{cursor:pointer;}
  .muted{color:var(--ink-muted);}
  .tag{font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--border);}
  .tag-e{background:var(--good-soft);color:var(--good);border-color:transparent;}
  .tag-s{background:var(--warn-soft);color:var(--warn);border-color:transparent;}
  .totals-row td{font-weight:700;background:var(--surface-2);}
  .sticky-actions{position:sticky;bottom:0;background:var(--surface);padding:12px 0 2px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:12px;}
  @media (max-width:640px){ .shell{padding:16px 16px 56px;} section.tab-section{padding:16px;} .search-input{min-width:0;flex:1 1 160px;} }
  table.wide{min-width:1150px;}
  td.desc{min-width:240px;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="shell">
  <header class="top no-print">
    <div class="brand">
      <img id="brand-logo" alt="ValexFruit" src="">
      <div class="titles">
        <div class="app-name">Controle de Estoque de Embalagens</div>
        <div class="app-sub">Cooperativa Agrícola Vale do São Francisco</div>
      </div>
    </div>
    <div class="header-right no-print">
      <div id="sync-pill" class="sync-pill"><span class="sync-dot"></span><span id="sync-text">Conectando…</span></div>
      <div id="user-area"></div>
    </div>
  </header>

  <nav class="tabs no-print" id="tabs"></nav>

  <main id="app"></main>
</div>

<input type="file" id="file-xlsx" accept=".xlsx,.xls,.xlsm" style="display:none">

<!-- Dialog: Novo usuário -->
<dialog id="dlg-usuario">
  <form id="form-usuario" method="dialog">
    <div class="dialog-head">
      <h3>Novo usuário</h3>
      <button type="button" class="close-x" data-action="close-dialog" data-dlg="dlg-usuario">&times;</button>
    </div>
    <div class="dialog-body">
      <div class="field"><label for="u-nome">Nome</label><input id="u-nome" required placeholder="Ex.: João da Silva"></div>
      <div class="field"><label for="u-email">E-mail</label><input id="u-email" type="email" required autocomplete="off" placeholder="ex.: joao.silva@valexfruit.com.br"></div>
      <div class="field-row">
        <div class="field"><label for="u-senha">Senha</label><input id="u-senha" type="password" required minlength="6"></div>
        <div class="field"><label for="u-senha2">Confirmar senha</label><input id="u-senha2" type="password" required minlength="6"></div>
      </div>
      <div class="field"><label for="u-papel">Papel</label>
        <select id="u-papel">
          <option value="operador">Operador (faz a contagem)</option>
          <option value="admin">Administrador (importa planilha)</option>
        </select>
      </div>
      <div class="hint">Os usuários são os mesmos do Controle de EPI: quem já tem acesso lá entra aqui com o mesmo e-mail e senha.</div>
    </div>
    <div class="dialog-foot">
      <button type="button" class="btn btn-secondary" data-action="close-dialog" data-dlg="dlg-usuario">Cancelar</button>
      <button type="submit" class="btn btn-primary">Criar usuário</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  'use strict';

  /* ================= Utilidades ================= */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtDateBR(iso){ if(!iso) return '—'; var p=String(iso).slice(0,10).split('-'); if(p.length!==3) return iso; return p[2]+'/'+p[1]+'/'+p[0]; }
  function fmtDateTimeBR(iso){ if(!iso) return '—'; var d=new Date(iso); if(isNaN(d)) return iso; return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
  function r6(n){ return Math.round((+n||0)*1e6)/1e6; }
  function fmtN(n, dec){ if(n==null || n==='' || isNaN(n)) return '—'; return Number(n).toLocaleString('pt-BR',{maximumFractionDigits: dec==null?3:dec}); }
  function fmtBRL(n){ return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function parseNumBR(s){
    s = String(s==null?'':s).trim();
    if(!s) return null;
    s = s.replace(/\s/g,'');
    if(s.indexOf(',')>=0){ s = s.replace(/\./g,'').replace(',', '.'); }
    var n = parseFloat(s);
    return isNaN(n) ? null : n;
  }
  function norm(s){ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim(); }
  function daysBetweenISO(aISO,bISO){ var a=new Date(aISO+'T00:00:00'), b=new Date(bISO+'T00:00:00'); return Math.round((b-a)/86400000); }
  function key(u,c){ return u+'|'+c; }
  function mercadoCurto(m){ return /EXTERNO/i.test(m||'') ? 'ME' : 'MI'; }

  /* ================= Estado ================= */
  var state = {
    tab: 'painel',
    base: null,              // emb_base/atual (planilha importada em uso)
    importacoes: [],
    contagens: [],
    usuarios: [],
    preview: null,           // planilha lida aguardando confirmação
    importando: false,
    filters: {
      estoque:{q:'', unidade:'todas', mercado:'todos', status:'todos'},
      mov:{q:'', unidade:'todas', tipo:'todos', ini:'', fim:'', codigo:''},
      coop:{q:'', so:'saldo'}
    },
    contagem: { data: todayISO(), unidade: 'MATRIZ', q:'' },
    draft: {},               // valores digitados na contagem ainda não salvos: {docId:{c<cod>: '123'}}
    draftObs: {},
    salvandoContagem: false,
    currentUser: null,

  /* ================= Firestore via REST (mesma técnica do app de EPI) ================= */
  function makeRestDb(){
    var DOCROOT = 'projects/'+firebaseConfig.projectId+'/databases/(default)/documents';
    var BASE = 'https://firestore.googleapis.com/v1/'+DOCROOT;
    /* Gravações via POST :commit (algumas redes/antivírus bloqueiam o método PATCH) */
    async function commitWrite(path, data, mask){
      var w = {update:{name: DOCROOT+'/'+path, fields: jsToFields(data)}};
      if(mask) w.updateMask = {fieldPaths: mask};
      var tentativa = 0;
      while(true){
        try{ return await req('POST', BASE+':commit', {writes:[w]}); }
        catch(e){ if(e.status || tentativa>=2) throw e; tentativa++; await new Promise(function(r){ setTimeout(r, 1500*tentativa); }); }
      }
    }
    function jsToValue(v){
      if(v===null || v===undefined) return {nullValue:null};
      if(typeof v==='boolean') return {booleanValue:v};
      if(typeof v==='number') return Number.isInteger(v) ? {integerValue:String(v)} : {doubleValue:v};
      if(Array.isArray(v)) return {arrayValue:{values:v.map(jsToValue)}};
      if(typeof v==='object') return {mapValue:{fields:jsToFields(v)}};
      return {stringValue:String(v)};
    }
    function valueToJs(val){
      if(!val) return null;
      if('nullValue' in val) return null;
      if('booleanValue' in val) return val.booleanValue;
      if('integerValue' in val) return parseInt(val.integerValue,10);
      if('doubleValue' in val) return val.doubleValue;
      if('stringValue' in val) return val.stringValue;
      if('timestampValue' in val) return val.timestampValue;
      if('arrayValue' in val) return (val.arrayValue.values||[]).map(valueToJs);
      if('mapValue' in val) return fieldsToJs(val.mapValue.fields||{});
      return null;
    }
    function jsToFields(obj){ var out={}; for(var k in obj){ if(Object.prototype.hasOwnProperty.call(obj,k) && obj[k]!==undefined) out[k]=jsToValue(obj[k]); } return out; }
    function fieldsToJs(fields){ var out={}; for(var k in fields){ if(Object.prototype.hasOwnProperty.call(fields,k)) out[k]=valueToJs(fields[k]); } return out; }
    async function authHeaders(){
      var h = {'Content-Type':'application/json'};
      if(auth && auth.currentUser){ try{ var t = await auth.currentUser.getIdToken(); h['Authorization']='Bearer '+t; }catch(e){} }
      return h;
    }
    async function req(method, url, body){
      var headers = await authHeaders();
      var resp = await fetch(url, {method:method, headers:headers, body: body!==undefined ? JSON.stringify(body) : undefined});
      if(!resp.ok){ var txt=''; try{ txt=await resp.text(); }catch(e){} var err=new Error('Firestore REST '+resp.status+': '+txt); err.status=resp.status; throw err; }
      var t2 = await resp.text();
      return t2 ? JSON.parse(t2) : null;
    }
    function docRef(path){
      var id = path.split('/').pop();
      return {
        id:id,
        get: async function(){
          try{ var json = await req('GET', BASE+'/'+path); var f = json && json.fields ? fieldsToJs(json.fields) : {}; return {exists:true, id:id, data:function(){ return f; }}; }
          catch(e){ if(e.status===404) return {exists:false, id:id, data:function(){ return undefined; }}; throw e; }
        },
        set: async function(data){ await commitWrite(path, data, null); },
        update: async function(data){
          await commitWrite(path, data, Object.keys(data));
        },
        del: async function(){ await req('DELETE', BASE+'/'+path); }
      };
    }
    function collRef(collPath){
      var self = {
        get: async function(){
          var docs=[], pageToken='';
          do{
            var url = BASE+'/'+collPath+'?pageSize=300'+(pageToken?('&pageToken='+encodeURIComponent(pageToken)):'');
            var json = await req('GET', url);
            (json && json.documents || []).forEach(function(d){ var did=d.name.split('/').pop(); docs.push({id:did, data:function(){ return fieldsToJs(d.fields||{}); }}); });
            pageToken = json && json.nextPageToken;
          }while(pageToken && docs.length<5000);
          return {docs:docs, empty:docs.length===0};
        },
        onSnapshot: function(cb, errCb){
          var stopped=false;
          async function poll(){
            if(stopped) return;
            try{ var snap = await self.get(); if(!stopped) cb(snap); }catch(e){ if(errCb) errCb(e); }
            if(!stopped) setTimeout(poll, 15000);
          }
          poll();
          return function(){ stopped=true; };
        }
      };
      return self;
    }
    return {doc:docRef, collection:collRef};
  }

          state.currentUser=null; state.authError='';

          }catch(e){ state.authView='network-error'; }

            await auth.signOut();

  async function attemptSetup(nome, email, senha, senha2){
    if(!nome || !email || !senha){ state.authError='Preencha todos os campos.'; render(); return; }
    if(senha.length<6){ state.authError='A senha deve ter pelo menos 6 caracteres.'; render(); return; }

    suppressAuthListener = true;
    try{
      var cred;
      try{ cred = await auth.createUserWithEmailAndPassword(email, senha); }
      catch(ae){ if(ae && ae.code==='auth/email-already-in-use'){ cred = await auth.signInWithEmailAndPassword(email, senha); } else throw ae; }
      await db.doc('usuarios/'+cred.user.uid).set({nome:nome, email:email, papel:'admin', ativo:true, criadoEm:todayISO()});
      await db.doc('meta/config').set({hasUsers:true});
      state.currentUser = {uid:cred.user.uid, email:email, nome:nome, papel:'admin'};
      state.authError=''; state.authView=null; render(); subscribeAll();
    }catch(e){
      var det = e && e.message ? e.message : '';
      state.authError = /Failed to fetch|NetworkError|Load failed/i.test(det)
        ? 'A conexão com o banco foi bloqueada nesta rede (antivírus, firewall ou bloqueador de anúncios). Toque em "Criar conta e entrar" de novo com os MESMOS dados; se continuar, teste pela internet do celular.'
        : 'Não foi possível criar a conta. '+(det ? 'Detalhe: '+det : '');

  /* ================= Leitura da planilha Excel ================= */
  function sheetRows(ws){ return XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:false}); }
  function toISODate(v){
    if(v==null || v==='') return '';
    if(typeof v==='number'){ var p = XLSX.SSF.parse_date_code(v); if(!p) return ''; return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0'); }
    if(v instanceof Date){ return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0'); }
    var s=String(v).trim(), m;
    if((m=s.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/))){ var y=m[3].length===2?('20'+m[3]):m[3]; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
    if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1]+'-'+m[2]+'-'+m[3];
    return '';
  }
  function toNum(v){ if(typeof v==='number') return v; var n=parseNumBR(v); return n==null?0:n; }
  function findCol(header, names){
    var H = header.map(norm);
    for(var i=0;i<names.length;i++){ var idx = H.indexOf(names[i]); if(idx>=0) return idx; }
    for(var j=0;j<names.length;j++){ for(var k=0;k<H.length;k++){ if(H[k].indexOf(names[j])===0) return k; } }
    return -1;
  }

  function lerPlanilha(wb, nomeArquivo){
    var res = { arquivo:nomeArquivo, abas:[], avisos:[], produtos:[], movimentos:[], dataBase:'', horaBase:'', ignorados:{} };
    var fiscalName = wb.SheetNames.find(function(n){ var N=norm(n); return N.indexOf('ESTOQUE')>=0 && N.indexOf('EMBALAG')>=0; });
    if(!fiscalName){ res.erro = 'Não encontrei a aba "ESTOQUE FISCAL EMBALAGENS" na planilha.'; return res; }

    // 1) Estoque fiscal de embalagens (cadastro de itens)
    var fr = sheetRows(wb.Sheets[fiscalName]);
    var fh = fr[0]||[];
    var cU=findCol(fh,['MATRIZ FILIAL','MATRIZ','FILIAL']), cM=findCol(fh,['EMBALAGENS MI ME','MI ME','MERCADO']), cC=findCol(fh,['COD PRODUTO','COD DO PRODUTO','CODIGO','COD']),
        cD=findCol(fh,['DESCRICAO DO PRODUTO','DESCRICAO','PRODUTO']), cN=findCol(fh,['NCM']), cUn=findCol(fh,['UN','UM','UNIDADE']), cQ=findCol(fh,['ESTOQUE FISCAL DISPONIVEL','ESTOQUE FISCAL','ESTOQUE','SALDO']);
    if(cC<0 || cQ<0){ res.erro='Na aba "'+fiscalName+'" não achei as colunas de código e de estoque.'; return res; }
    var hq = String(fh[cQ]||''), m;
    if((m = hq.match(/(\d{1,2})[\.\/](\d{1,2})[\.\/](\d{2,4})(?:\s+(\d{1,2}:\d{2}))?/))){
      res.dataBase = (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
      res.horaBase = m[4]||'';
    }
    var vistos = {};
    for(var i=1;i<fr.length;i++){
      var r=fr[i]; if(!r || r[cC]==null || r[cC]==='') continue;
      var u = String(r[cU]||'MATRIZ').trim().toUpperCase().indexOf('FILIAL')>=0 ? 'FILIAL' : 'MATRIZ';
      var cod = String(r[cC]).trim();
      var k = key(u,cod);
      if(vistos[k]) { vistos[k].q = r6(vistos[k].q + toNum(r[cQ])); continue; }
      var p = { u:u, c:cod, d:String(r[cD]||'').trim(), mi: mercadoCurto(r[cM]), ncm: r[cN]!=null?String(r[cN]):'', un:String(r[cUn]||'').trim().toUpperCase(), q:r6(toNum(r[cQ])) };
      vistos[k]=p; res.produtos.push(p);
    }
    res.abas.push({nome:fiscalName, tipo:'Estoque fiscal', linhas:res.produtos.length});
    var codigos = {}; res.produtos.forEach(function(p){ codigos[p.c]=true; });

    // 2) Entradas e saídas (Matriz e Filial)
    wb.SheetNames.forEach(function(n){
      var N = norm(n), tipo = null;
      if(N.indexOf('ENTRADA')===0) tipo='E'; else if(N.indexOf('SAIDA')===0) tipo='S';
      if(!tipo) return;
      var u = N.indexOf('FILIAL')>=0 ? 'FILIAL' : 'MATRIZ';
      var rows = sheetRows(wb.Sheets[n]); var h = rows[0]||[];
      var iNF=findCol(h,['NF','NOTA','NOTA FISCAL']), iDt=findCol(h,['EMISSAO','DATA']), iP=findCol(h,['FORNECEDOR','CLIENTE','PARCEIRO']), iDoc=findCol(h,['CPF CNPJ','CNPJ','CPF']),
          iCf=findCol(h,['CFOP']), iOp=findCol(h,['OPERACAO']), iC=findCol(h,['CODIGO','COD']), iD=findCol(h,['PRODUTO','DESCRICAO']), iQ=findCol(h,['QTD','QUANTIDADE']),
          iVu=findCol(h,['VLR UNITARIO','VALOR UNITARIO']), iT=findCol(h,['TOTAL','VALOR TOTAL']), iMv=findCol(h,['MOV ESTOQUE','MOVIMENTA ESTOQUE']);
      if(iC<0 || iQ<0){ res.avisos.push('Aba "'+n+'" ignorada: não achei as colunas CODIGO e QTD.'); return; }
      var lidas=0, emb=0;
      for(var i=1;i<rows.length;i++){
        var r=rows[i]; if(!r || r[iC]==null || r[iC]==='') continue;
        lidas++;
        var cod=String(r[iC]).trim();
        if(!codigos[cod]){
          if(/^[45]/.test(cod)){ var nm=String(r[iD]||cod); res.ignorados[cod]=nm; }
          continue;
        }
        emb++;
        var mv = iMv>=0 ? norm(r[iMv])==='SIM' : true;
        res.movimentos.push({
          u:u, t:tipo, nf: r[iNF]!=null?String(r[iNF]):'', dt: toISODate(r[iDt]), p: String(r[iP]||'').trim(), doc: iDoc>=0?String(r[iDoc]||''):'',
          cf: iCf>=0 && r[iCf]!=null ? String(r[iCf]) : '', op: String(r[iOp]||'').trim(), c:cod, q:r6(toNum(r[iQ])), vu: iVu>=0?r6(toNum(r[iVu])):0, v: iT>=0?Math.round(toNum(r[iT])*100)/100:0, m:mv
        });
      }
      var dts = res.movimentos.filter(function(x){ return x.u===u && x.t===tipo && x.dt; }).map(function(x){ return x.dt; }).sort();
      res.abas.push({nome:n, tipo:(tipo==='E'?'Entradas':'Saídas')+' '+(u==='FILIAL'?'Filial':'Matriz'), linhas:lidas, emb:emb, u:u, t:tipo, ini:dts[0]||'', fim:dts[dts.length-1]||''});
    });
    var datas = res.movimentos.map(function(x){ return x.dt; }).filter(Boolean).sort();
    res.periodo = { ini: datas[0]||'', fim: datas[datas.length-1]||'' };
    if(!res.dataBase){ res.dataBase = res.periodo.fim || todayISO(); res.avisos.push('Não achei a data no título da coluna de estoque fiscal; usei '+fmtDateBR(res.dataBase)+'.'); }
    ['MATRIZ','FILIAL'].forEach(function(u){
      var e=res.abas.find(function(a){ return a.u===u && a.t==='E'; }), sd=res.abas.find(function(a){ return a.u===u && a.t==='S'; });
      if(e && sd && e.fim && sd.fim && e.fim!==sd.fim){
        var menor = e.fim<sd.fim ? e : sd, maior = e.fim<sd.fim ? sd : e;
        res.avisos.push('Atenção: "'+menor.nome+'" vai só até '+fmtDateBR(menor.fim)+', enquanto "'+maior.nome+'" vai até '+fmtDateBR(maior.fim)+'. Se faltam notas no fim do período, o consumo/dia e o estoque fiscal recalculado para datas passadas ficam distorcidos (podem até ficar negativos).');
      }
    });
    if(!res.abas.some(function(a){ return a.tipo.indexOf('Saídas')===0; })) res.avisos.push('Nenhuma aba de SAÍDAS encontrada — o consumo e a cobertura ficarão zerados.');
    return res;
  }

  function lerArquivo(file){
    if(!file) return;

      try{
        var wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});

      state.tab='importar'; render();
    };
    reader.readAsArrayBuffer(file);
  }

  async function salvarImportacao(){

    try{
      var id = 'imp-'+Date.now().toString(36);
      var agora = new Date().toISOString();
      var base = { importId:id, importadoEm:agora, importadoPor:registradoPor(), arquivo:p.arquivo, dataBase:p.dataBase, horaBase:p.horaBase,
        periodo:p.periodo, produtos:p.produtos, movimentos:p.movimentos };
      var tamanho = JSON.stringify(base).length;
      if(tamanho > 900000){ alert('A planilha tem movimentos demais para um único envio ('+Math.round(tamanho/1024)+' KB). Envie um período menor (ex.: um mês).'); state.importando=false; render(); return; }
      await db.doc('emb_base/atual').set(base);
      await db.doc('emb_importacoes/'+id).set({ importadoEm:agora, importadoPor:registradoPor(), arquivo:p.arquivo, dataBase:p.dataBase, horaBase:p.horaBase,
        periodoIni:p.periodo.ini, periodoFim:p.periodo.fim, itens:p.produtos.length, movimentos:p.movimentos.length });
      state.base = base; indexarBase();
      state.importacoes.unshift({id:id, importadoEm:agora, importadoPor:registradoPor(), arquivo:p.arquivo, dataBase:p.dataBase, horaBase:p.horaBase, periodoIni:p.periodo.ini, periodoFim:p.periodo.fim, itens:p.produtos.length, movimentos:p.movimentos.length});
      state.preview = null; state.tab='estoque';
    }catch(e){
      alert(e && e.status===403 ? 'O banco recusou a gravação (permissão). Veja na aba Usuários as regras que precisam ser liberadas no Firebase.' : 'Não foi possível salvar a planilha agora. Tente novamente.');
    }
    state.importando=false; render();
  }

  /* ================= Cálculos ================= */
  var IDX = { prod:{}, movPorItem:{} };
  function indexarBase(){
    IDX = { prod:{}, movPorItem:{} };
    if(!state.base) return;
    (state.base.produtos||[]).forEach(function(p){ IDX.prod[key(p.u,p.c)] = p; });
    (state.base.movimentos||[]).forEach(function(m){ var k=key(m.u,m.c); (IDX.movPorItem[k]=IDX.movPorItem[k]||[]).push(m); });
  }
  function diasPeriodo(){
    var b=state.base; if(!b || !b.periodo || !b.periodo.ini) return 1;
    var fim = b.dataBase && b.dataBase>b.periodo.fim ? b.dataBase : b.periodo.fim;
    return Math.max(1, daysBetweenISO(b.periodo.ini, fim)+1);
  }
  function resumoItem(p){
    var movs = IDX.movPorItem[key(p.u,p.c)] || [];
    var ent=0, sai=0;
    movs.forEach(function(m){ if(!m.m) return; if(m.t==='E') ent+=m.q; else sai+=m.q; });
    var consumoDia = sai / diasPeriodo();
    var cobertura = consumoDia>0 ? p.q/consumoDia : null;
    return { ent:r6(ent), sai:r6(sai), consumoDia:consumoDia, cobertura:cobertura };
  }
  function coberturaChip(cob, q){
    if(q<=0) return {cls:'chip-critical', label:'Zerado', key:'critico'};
    if(cob==null) return {cls:'chip-neutral', label:'Sem consumo', key:'parado'};
    if(cob<7) return {cls:'chip-critical', label:fmtN(cob,0)+' dia(s)', key:'critico'};
    if(cob<15) return {cls:'chip-warn', label:fmtN(cob,0)+' dias', key:'atencao'};
    return {cls:'chip-good', label:fmtN(cob,0)+' dias', key:'ok'};
  }
  /* Estoque fiscal teórico no fim do dia D:
     estoque da planilha (data base) − entradas posteriores a D + saídas posteriores a D */
  function fiscalNaData(p, dataISO){
    var q = p.q;
    if(!state.base || !dataISO || dataISO >= state.base.dataBase) return r6(q);
    (IDX.movPorItem[key(p.u,p.c)]||[]).forEach(function(m){
      if(!m.m || !m.dt) return;
      if(m.dt > dataISO && m.dt <= state.base.dataBase){ q += (m.t==='E' ? -m.q : m.q); }
    });
    return r6(q);
  }
  function contagemId(data, unidade){ return data+'_'+unidade; }
  function contagemDoc(data, unidade){ return state.contagens.find(function(c){ return c.id===contagemId(data,unidade); }); }
  function ultimaContagemItem(p){
    for(var i=0;i<state.contagens.length;i++){
      var c = state.contagens[i];
      if(c.unidade!==p.u || !c.itens) continue;
      var v = c.itens['c'+p.c];
      if(v!=null && v!=='') return {data:c.data, qtd:+v, fiscal:fiscalNaData(p,c.data)};
    }
    return null;
  }
  function difChip(dif, fiscal){
    if(dif==null) return {cls:'chip-neutral', label:'Não contado', key:'nao'};
    if(Math.abs(dif) < 1e-9) return {cls:'chip-good', label:'Confere', key:'ok'};
    var pct = fiscal ? Math.abs(dif/fiscal)*100 : 100;
    if(pct<=2) return {cls:'chip-warn', label:(dif>0?'Sobra ':'Falta ')+fmtN(Math.abs(dif)), key:'leve'};
    return {cls:'chip-critical', label:(dif>0?'Sobra ':'Falta ')+fmtN(Math.abs(dif)), key:'diverge'};
  }
  function produtosFiltrados(unidade){
    if(!state.base) return [];
    return (state.base.produtos||[]).filter(function(p){ return unidade==='todas' || p.u===unidade; })
      .slice().sort(function(a,b){ return a.u.localeCompare(b.u) || a.mi.localeCompare(b.mi) || a.d.localeCompare(b.d); });
  }
  function registradoPor(){ return state.currentUser ? (state.currentUser.nome||state.currentUser.email) : ''; }
  function nomeUnidade(u){ return u==='FILIAL' ? 'Filial' : 'Matriz'; }

  /* ================= Exportar para Excel ================= */
  function exportarExcel(nomeArquivo, abas){
    try{
      var wb = XLSX.utils.book_new();
      abas.forEach(function(a){
        var ws = XLSX.utils.aoa_to_sheet([a.cab].concat(a.linhas));
        ws['!cols'] = a.cab.map(function(h,i){ var w=String(h).length; a.linhas.slice(0,200).forEach(function(l){ w=Math.max(w, String(l[i]==null?'':l[i]).length); }); return {wch:Math.min(60, w+2)}; });
        XLSX.utils.book_append_sheet(wb, ws, a.nome.slice(0,31));
      });
      XLSX.writeFile(wb, nomeArquivo);
    }catch(e){ alert('Não foi possível gerar o Excel agora.'); }
  }

  /* ---------- Painel ---------- */
  function renderPainel(){
    var prods = produtosFiltrados('todas');
    var criticos=[], atencao=[];
    prods.forEach(function(p){ var r=resumoItem(p), ch=coberturaChip(r.cobertura,p.q); if(ch.key==='critico') criticos.push({p:p,r:r,ch:ch}); else if(ch.key==='atencao') atencao.push({p:p,r:r,ch:ch}); });
    criticos.sort(function(a,b){ return (a.r.cobertura==null?-1:a.r.cobertura)-(b.r.cobertura==null?-1:b.r.cobertura); });
    var hoje = todayISO();
    var cHoje = ['MATRIZ','FILIAL'].map(function(u){
      var total = prods.filter(function(p){ return p.u===u; }).length;
      if(!total) return null;
      var doc = contagemDoc(hoje,u); var feitos = doc && doc.itens ? Object.keys(doc.itens).filter(function(k){ return doc.itens[k]!=null && doc.itens[k]!==''; }).length : 0;
      return {u:u,total:total,feitos:feitos};
    }).filter(Boolean);
    // divergências da contagem mais recente de cada unidade
    var diverg=[];
    ['MATRIZ','FILIAL'].forEach(function(u){
      var c = state.contagens.find(function(x){ return x.unidade===u; }); if(!c || !c.itens) return;
      prods.filter(function(p){ return p.u===u; }).forEach(function(p){
        var v=c.itens['c'+p.c]; if(v==null || v==='') return;
        var f=fiscalNaData(p,c.data), dif=r6(+v - f), ch=difChip(dif,f);
        if(ch.key==='diverge' || ch.key==='leve') diverg.push({p:p,c:c,dif:dif,ch:ch});
      });
    });
    var nDiverg = diverg.filter(function(d){ return d.ch.key==='diverge'; }).length;

    var kpis = '<div class="kpi-grid">'+
      '<div class="kpi"><div class="num">'+prods.length+'</div><div class="label">itens de embalagem no estoque fiscal</div></div>'+
      '<div class="kpi '+(criticos.length?'tone-critical':'')+'"><div class="num">'+criticos.length+'</div><div class="label">com cobertura abaixo de 7 dias (ou zerados)</div></div>'+
      '<div class="kpi '+(nDiverg?'tone-critical':'')+'"><div class="num">'+nDiverg+'</div><div class="label">divergências relevantes na última contagem</div></div>'+
      '<div class="kpi tone-warn"><div class="num" style="font-size:1.4rem;padding-top:6px">'+fmtDateBR(state.base.dataBase)+'</div><div class="label">data da base fiscal importada</div></div>'+
    '</div>';

    var pCont = '<div class="panel"><h3>Contagem de hoje ('+fmtDateBR(hoje)+')</h3>'+
      cHoje.map(function(x){ var pct=Math.round(x.feitos/x.total*100);
        return '<div class="alert-row"><div><strong>'+nomeUnidade(x.u)+'</strong><div class="meta">'+x.feitos+' de '+x.total+' itens contados</div></div>'+
          '<div style="display:flex;align-items:center;gap:10px"><div class="progress" style="min-width:90px"><span style="width:'+pct+'%"></span></div>'+
          '<button class="btn btn-ghost" data-action="ir-contagem" data-u="'+x.u+'">'+(x.feitos?'Continuar':'Iniciar')+'</button></div></div>'; }).join('')+
    '</div>';
    var pCrit = '<div class="panel"><h3>Cobertura crítica</h3>'+
      (criticos.length ? criticos.slice(0,8).map(function(x){ return '<div class="alert-row"><div>'+esc(x.p.d)+'<div class="meta">'+nomeUnidade(x.p.u)+' · '+fmtN(x.p.q)+' '+esc(x.p.un)+' · consome '+fmtN(x.r.consumoDia,2)+'/dia</div></div><span class="chip '+x.ch.cls+'">'+esc(x.ch.label)+'</span></div>'; }).join('')
       + (criticos.length>8?'<div class="empty-msg">+ '+(criticos.length-8)+' item(ns) — veja a aba Estoque</div>':'')
      : '<div class="empty-msg">Nenhum item com cobertura abaixo de 7 dias.</div>')+
      (atencao.length?'<div class="hint" style="margin-top:8px">'+atencao.length+' item(ns) entre 7 e 15 dias de cobertura.</div>':'')+
    '</div>';
    diverg.sort(function(a,b){ return Math.abs(b.dif/(fiscalNaData(b.p,b.c.data)||1)) - Math.abs(a.dif/(fiscalNaData(a.p,a.c.data)||1)); });
    var pDiv = '<div class="panel"><h3>Divergências — última contagem</h3>'+
      (diverg.length ? diverg.slice(0,8).map(function(x){ return '<div class="alert-row"><div>'+esc(x.p.d)+'<div class="meta">'+nomeUnidade(x.p.u)+' · contagem de '+fmtDateBR(x.c.data)+'</div></div><span class="chip '+x.ch.cls+'">'+esc(x.ch.label)+' '+esc(x.p.un)+'</span></div>'; }).join('')
      : '<div class="empty-msg">'+(state.contagens.length?'Nenhuma divergência na última contagem.':'Nenhuma contagem registrada ainda.')+'</div>')+
    '</div>';
    return kpis+'<div class="panels-grid">'+pCont+pCrit+pDiv+'</div>'+baseInfoLine()+
      '<div class="hint" style="margin-top:6px">Cobertura = estoque fiscal ÷ consumo médio diário (saídas que movimentam estoque no período da planilha).</div>';
  }

  /* ---------- Estoque ---------- */
  function linhasEstoque(){
    var f=state.filters.estoque, q=norm(f.q);
    return produtosFiltrados(f.unidade).filter(function(p){
      if(f.mercado!=='todos' && p.mi!==f.mercado) return false;
      if(q && norm(p.d+' '+p.c).indexOf(q)<0) return false;
      return true;
    }).map(function(p){
      var r=resumoItem(p), ch=coberturaChip(r.cobertura,p.q), uc=ultimaContagemItem(p);
      var dif = uc ? r6(uc.qtd-uc.fiscal) : null, dch=difChip(dif, uc&&uc.fiscal);
      return {p:p,r:r,ch:ch,uc:uc,dif:dif,dch:dch};
    }).filter(function(l){
      if(f.status==='todos') return true;
      if(f.status==='critico') return l.ch.key==='critico';
      if(f.status==='atencao') return l.ch.key==='atencao';
      if(f.status==='diverge') return l.dch.key==='diverge' || l.dch.key==='leve';
      if(f.status==='nao') return l.dch.key==='nao';
      return true;
    });
  }
  function renderEstoque(){
    var f=state.filters.estoque, linhas=linhasEstoque();
    var rows = linhas.length ? linhas.map(function(l){ var p=l.p;
      return '<tr class="clickable" data-action="ver-kardex" data-u="'+p.u+'" data-c="'+esc(p.c)+'" title="Ver movimentações deste item">'+
        '<td>'+nomeUnidade(p.u)+'</td><td><span class="tag">'+p.mi+'</span></td><td class="num">'+esc(p.c)+'</td><td class="desc"><strong>'+esc(p.d)+'</strong></td><td>'+esc(p.un)+'</td>'+
        '<td class="num"><strong>'+fmtN(p.q)+'</strong></td><td class="num pos">'+fmtN(l.r.ent)+'</td><td class="num neg">'+fmtN(l.r.sai)+'</td>'+
        '<td class="num">'+fmtN(l.r.consumoDia,2)+'</td><td><span class="chip '+l.ch.cls+'">'+esc(l.ch.label)+'</span></td>'+
        '<td class="num">'+(l.uc?fmtN(l.uc.qtd)+'<div class="hint">'+fmtDateBR(l.uc.data)+'</div>':'—')+'</td>'+
        '<td><span class="chip '+l.dch.cls+'">'+esc(l.dch.label)+'</span></td></tr>';
    }).join('') : '<tr><td colspan="12"><div class="empty-msg">Nenhum item encontrado com esses filtros.</div></td></tr>';
    return '<section class="tab-section">'+
      '<div class="section-head"><h2>Estoque de embalagens</h2><div class="toolbar"><button class="btn btn-secondary" data-action="export-estoque">Exportar Excel</button></div></div>'+
      '<div class="filters">'+
        '<input class="search-input" id="f-est-q" data-filter="estoque.q" placeholder="Buscar item ou código…" value="'+esc(f.q)+'">'+
        sel('estoque.unidade', f.unidade, [['todas','Matriz e Filial'],['MATRIZ','Matriz'],['FILIAL','Filial']])+
        sel('estoque.mercado', f.mercado, [['todos','MI e ME'],['MI','Mercado interno'],['ME','Mercado externo']])+
        sel('estoque.status', f.status, [['todos','Todos os status'],['critico','Cobertura crítica'],['atencao','Cobertura em atenção'],['diverge','Com divergência na contagem'],['nao','Nunca contados']])+
      '</div>'+
      '<div class="table-wrap"><table class="wide"><thead><tr><th>Unid.</th><th>Merc.</th><th class="num">Código</th><th>Descrição</th><th>UN</th><th class="num">Estoque fiscal</th><th class="num">Entradas</th><th class="num">Saídas</th><th class="num">Consumo/dia</th><th>Cobertura</th><th class="num">Última contagem</th><th>Contagem × fiscal</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div style="margin-top:10px">'+baseInfoLine()+'<div class="hint">Entradas e saídas consideram só as notas com "MOV. ESTOQUE = Sim". Clique em um item para ver as notas.</div></div>'+
    '</section>';
  }
  function sel(filterKey, val, opts){
    return '<select data-filter="'+filterKey+'">'+opts.map(function(o){ return '<option value="'+esc(o[0])+'"'+(o[0]===val?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+'</select>';
  }
  function exportEstoque(){
    var cab=['Unidade','Mercado','Código','Descrição','UN','Estoque fiscal '+fmtDateBR(state.base.dataBase),'Entradas período','Saídas período','Consumo médio/dia','Cobertura (dias)','Última contagem (data)','Última contagem (qtd)','Fiscal na data da contagem','Diferença (contado − fiscal)'];
    var linhas = linhasEstoque().map(function(l){ var p=l.p; return [nomeUnidade(p.u),p.mi,p.c,p.d,p.un,p.q,l.r.ent,l.r.sai,Math.round(l.r.consumoDia*100)/100,l.r.cobertura==null?'':Math.round(l.r.cobertura),l.uc?fmtDateBR(l.uc.data):'',l.uc?l.uc.qtd:'',l.uc?l.uc.fiscal:'',l.dif==null?'':l.dif]; });
    exportarExcel('estoque-embalagens-'+todayISO()+'.xlsx', [{nome:'Estoque', cab:cab, linhas:linhas}]);

  /* ---------- Contagem diária ---------- */
  function draftFor(docId){
    if(!state.draft[docId]){
      var doc = state.contagens.find(function(c){ return c.id===docId; });
      state.draft[docId] = {};
      if(doc && doc.itens) Object.keys(doc.itens).forEach(function(k){ var v=doc.itens[k]; state.draft[docId][k] = v==null?'':String(v).replace('.',','); });
      state.draftObs[docId] = doc && doc.obs || '';
      state.draft[docId].__salvo = true;
    }
    return state.draft[docId];
  }
  function renderContagem(){
    var c=state.contagem, docId=contagemId(c.data,c.unidade), d=draftFor(docId), doc=contagemDoc(c.data,c.unidade);
    var prods = produtosFiltrados(c.unidade), q=norm(c.q);
    var feitos = prods.filter(function(p){ var v=d['c'+p.c]; return v!=null && v!==''; }).length;
    var pct = prods.length ? Math.round(feitos/prods.length*100) : 0;
    var rows = prods.filter(function(p){ return !q || norm(p.d+' '+p.c).indexOf(q)>=0; }).map(function(p){
      var fiscal = fiscalNaData(p, c.data), v = d['c'+p.c], n = parseNumBR(v), dif = n==null?null:r6(n-fiscal), ch=difChip(dif,fiscal);
      return '<tr><td><span class="tag">'+p.mi+'</span></td><td class="num">'+esc(p.c)+'</td><td><strong>'+esc(p.d)+'</strong></td><td>'+esc(p.un)+'</td>'+
        '<td class="num">'+fmtN(fiscal)+(fiscal<0?'<div class="hint neg">negativo — faltam notas na planilha?</div>':'')+'</td>'+
        '<td class="num"><input class="count-input'+(n!=null?' filled':'')+'" id="cnt-'+esc(p.c)+'" data-count="'+esc(p.c)+'" inputmode="decimal" autocomplete="off" value="'+esc(v==null?'':v)+'" placeholder="—"></td>'+
        '<td class="num" id="dif-'+esc(p.c)+'">'+difCell(dif)+'</td><td id="st-'+esc(p.c)+'"><span class="chip '+ch.cls+'">'+esc(ch.label)+'</span></td></tr>';
    }).join('');
    var aviso = state.base && c.data > state.base.dataBase
      ? '<div class="hint-box">A base fiscal importada é de <strong>'+fmtDateBR(state.base.dataBase)+'</strong>. Para '+fmtDateBR(c.data)+' o estoque fiscal mostrado é o da base, sem as notas emitidas depois — importe a planilha atualizada para a comparação ficar exata.</div>'
      : (state.base && c.data < state.base.dataBase ? '<div class="hint-box">Estoque fiscal recalculado para o fim do dia <strong>'+fmtDateBR(c.data)+'</strong>: saldo de '+fmtDateBR(state.base.dataBase)+' desfazendo as notas emitidas depois dessa data.</div>' : '');

  function difCell(dif){
    if(dif==null) return '<span class="muted">—</span>';

  }
  function resumoContagem(c){
    var prods = produtosFiltrados(c.unidade), cont=0, ok=0, div=0;
    prods.forEach(function(p){ var v=c.itens && c.itens['c'+p.c]; if(v==null||v==='') return; cont++; var f=fiscalNaData(p,c.data), ch=difChip(r6(+v-f),f); if(ch.key==='ok') ok++; else div++; });
    return {total:prods.length, cont:cont, ok:ok, div:div};
  }
  function renderHistoricoContagens(){
    var list = state.contagens.slice(0,40);

      return '<tr><td>'+fmtDateBR(c.data)+'</td><td>'+nomeUnidade(c.unidade)+'</td><td class="num">'+r.cont+' / '+r.total+'</td><td class="num">'+r.ok+'</td><td class="num">'+(r.div?'<strong class="neg">'+r.div+'</strong>':'0')+'</td><td>'+esc(c.registradoPor||'—')+'</td><td class="hint">'+esc(c.obs||'')+'</td>'+

  function atualizarLinhaContagem(cod, valor){
    var c=state.contagem, docId=contagemId(c.data,c.unidade), d=draftFor(docId);
    d['c'+cod] = valor; d.__salvo = false;

    var fiscal=fiscalNaData(p,c.data), n=parseNumBR(valor), dif=n==null?null:r6(n-fiscal), ch=difChip(dif,fiscal);

  async function salvarContagem(){
    var c=state.contagem, docId=contagemId(c.data,c.unidade), d=draftFor(docId);
    var itens={}, invalidos=[];
    produtosFiltrados(c.unidade).forEach(function(p){
      var v=d['c'+p.c]; if(v==null || String(v).trim()==='') return;
      var n=parseNumBR(v); if(n==null || n<0){ invalidos.push(p.d); return; }
      itens['c'+p.c]=r6(n);
    });
    if(invalidos.length){ alert('Quantidade inválida em: '+invalidos.slice(0,5).join(', ')+(invalidos.length>5?'…':'')); return; }
    if(!Object.keys(itens).length){ alert('Digite ao menos uma quantidade contada.'); return; }
    state.salvandoContagem=true; render();
    try{
      var docData = {data:c.data, unidade:c.unidade, itens:itens, obs:state.draftObs[docId]||'', registradoPor:registradoPor(), atualizadoEm:new Date().toISOString(), baseImportId: state.base?state.base.importId:''};
      await db.doc('emb_contagens/'+docId).set(docData);
      var i = state.contagens.findIndex(function(x){ return x.id===docId; });
      var novo = Object.assign({id:docId}, docData);
      if(i>=0) state.contagens[i]=novo; else { state.contagens.push(novo); state.contagens.sort(function(a,b){ return (b.data||'').localeCompare(a.data||'') || (a.unidade||'').localeCompare(b.unidade||''); }); }
      delete state.draft[docId];
    }catch(e){
      alert(e && e.status===403 ? 'O banco recusou a gravação (permissão). Peça ao administrador para liberar as coleções "emb_" no Firebase (veja a aba Usuários).' : 'Não foi possível salvar agora. Seus números continuam na tela — tente de novo.');
    }
    state.salvandoContagem=false; render();
  }

    var linhas = produtosFiltrados(c.unidade).map(function(p){ var f=fiscalNaData(p,c.data), n=parseNumBR(d['c'+p.c]), dif=n==null?'':r6(n-f); return [fmtDateBR(c.data),nomeUnidade(p.u),p.mi,p.c,p.d,p.un,f,n==null?'':n,dif,difChip(n==null?null:dif,f).label]; });

  }

  /* ---------- Movimentações (kardex) ---------- */
  function movsFiltrados(){
    var f=state.filters.mov, q=norm(f.q);
    return (state.base.movimentos||[]).filter(function(m){
      if(f.unidade!=='todas' && m.u!==f.unidade) return false;
      if(f.codigo && m.c!==f.codigo) return false;
      if(f.tipo==='E' && m.t!=='E') return false;
      if(f.tipo==='S' && m.t!=='S') return false;
      if(f.tipo==='naomov' && m.m) return false;
      if(f.ini && m.dt < f.ini) return false;
      if(f.fim && m.dt > f.fim) return false;
      if(q){ var p=IDX.prod[key(m.u,m.c)]; if(norm(m.nf+' '+m.p+' '+m.op+' '+(p?p.d:'')+' '+m.c).indexOf(q)<0) return false; }
      return true;
    }).sort(function(a,b){ return (b.dt||'').localeCompare(a.dt||'') || (b.nf||'').localeCompare(a.nf||''); });
  }

    var mesmoItem = !!f.codigo;

  /* ---------- Em poder de cooperados ---------- */
  function ehRemessa(op){ var n=norm(op); return n.indexOf('REMESSA DE VASILHAME')>=0; }
  function ehRetorno(op){ var n=norm(op); return n.indexOf('RETORNO DE MATERIAIS DE EMBALAG')>=0 || n.indexOf('DEVOLUCAO REMESSA MATERIAIS')>=0; }
  function calcCoop(){
    var mapa={};
    (state.base.movimentos||[]).forEach(function(m){
      var rem = m.t==='S' && ehRemessa(m.op), ret = m.t==='E' && ehRetorno(m.op);
      if(!rem && !ret) return;
      var k = m.u+'|'+(m.doc||m.p)+'|'+m.c;
      var o = mapa[k] || (mapa[k] = {u:m.u, p:m.p, doc:m.doc, c:m.c, rem:0, ret:0, vRem:0});
      if(rem){ o.rem+=m.q; o.vRem+=m.v; } else { o.ret+=m.q; }
    });
    return Object.keys(mapa).map(function(k){ var o=mapa[k]; o.rem=r6(o.rem); o.ret=r6(o.ret); o.saldo=r6(o.rem-o.ret); o.prod=IDX.prod[key(o.u,o.c)]; return o; });
  }
  function coopFiltrado(){
    var f=state.filters.coop, q=norm(f.q);
    return calcCoop().filter(function(o){
      if(f.so==='saldo' && Math.abs(o.saldo)<1e-9) return false;
      if(q && norm(o.p+' '+o.doc+' '+(o.prod?o.prod.d:'')+' '+o.c).indexOf(q)<0) return false;
      return true;
    }).sort(function(a,b){ return a.p.localeCompare(b.p) || (a.prod?a.prod.d:'').localeCompare(b.prod?b.prod.d:''); });
  }
  function renderCoop(){
    var f=state.filters.coop, list=coopFiltrado();
    var coops={}; list.forEach(function(o){ coops[o.doc||o.p]=1; });
    var rows = list.length ? list.map(function(o){
      return '<tr><td><strong>'+esc(o.p)+'</strong><div class="hint">'+esc(o.doc)+'</div></td><td>'+esc(o.prod?o.prod.d:o.c)+'</td><td>'+esc(o.prod?o.prod.un:'')+'</td>'+
        '<td class="num">'+fmtN(o.rem)+'</td><td class="num">'+fmtN(o.ret)+'</td><td class="num"><strong class="'+(o.saldo<0?'neg':'')+'">'+fmtN(o.saldo)+'</strong></td></tr>'; }).join('')
      : '<tr><td colspan="6"><div class="empty-msg">Nenhum saldo encontrado.</div></td></tr>';
    return '<section class="tab-section">'+
      '<div class="section-head"><h2>Embalagens em poder de cooperados</h2><div class="toolbar"><button class="btn btn-secondary" data-action="export-coop">Exportar Excel</button></div></div>'+
      '<div class="hint-box">Saldo = <strong>remessas de vasilhame/sacaria</strong> (saídas 144 e 225) − <strong>retornos de materiais de embalagens</strong> (entradas 203 e devoluções 033), por cooperado e item, <strong>dentro do período da planilha</strong> ('+fmtDateBR(state.base.periodo.ini)+' a '+fmtDateBR(state.base.periodo.fim)+'). Saldo negativo indica retorno de remessa feita antes do período.</div>'+
      '<div class="filters"><input class="search-input" id="f-coop-q" data-filter="coop.q" placeholder="Buscar cooperado, CPF/CNPJ ou item…" value="'+esc(f.q)+'">'+
        sel('coop.so', f.so, [['saldo','Só com saldo'],['todos','Todos']])+
        '<span class="hint">'+Object.keys(coops).length+' cooperado(s) · '+list.length+' linha(s)</span></div>'+
      '<div class="table-wrap"><table><thead><tr><th>Cooperado</th><th>Item</th><th>UN</th><th class="num">Remetido</th><th class="num">Retornado</th><th class="num">Saldo em poder</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</section>';
  }
  function exportCoop(){
    var cab=['Unidade','Cooperado','CPF/CNPJ','Código','Item','UN','Remetido','Retornado','Saldo em poder','Valor remetido'];
    var linhas=coopFiltrado().map(function(o){ return [nomeUnidade(o.u),o.p,o.doc,o.c,o.prod?o.prod.d:'',o.prod?o.prod.un:'',o.rem,o.ret,o.saldo,Math.round(o.vRem*100)/100]; });
    exportarExcel('embalagens-em-poder-cooperados-'+todayISO()+'.xlsx', [{nome:'Em poder de cooperados', cab:cab, linhas:linhas}]);
  }

    '<section class="tab-section"><div class="section-head"><h2>Histórico de importações</h2></div>'+
      '<div class="table-wrap"><table><thead><tr><th>Importado em</th><th>Arquivo</th><th>Base fiscal</th><th>Período das notas</th><th class="num">Itens</th><th class="num">Notas</th><th>Por</th></tr></thead><tbody>'+hist+'</tbody></table></div></section>';

  /* ---------- Usuários ---------- */
  function renderUsuarios(){
    var list = state.usuarios.slice().sort(function(a,b){ return (a.nome||'').localeCompare(b.nome||''); });
    var rows = list.length ? list.map(function(u){ var ativo=u.ativo!==false;
      return '<tr><td><strong>'+esc(u.nome)+'</strong></td><td>'+esc(u.email)+'</td><td>'+(u.papel==='admin'?'Administrador':'Operador')+'</td><td>'+(ativo?'<span class="chip chip-good">Ativo</span>':'<span class="chip chip-neutral">Inativo</span>')+'</td>'+
        '<td><div class="row-actions"><button class="btn btn-ghost" data-action="reset-senha" data-email="'+esc(u.email)+'">Enviar redefinição de senha</button><button class="btn btn-ghost" data-action="toggle-usuario-ativo" data-id="'+esc(u.uid)+'">'+(ativo?'Desativar':'Reativar')+'</button></div></td></tr>'; }).join('')
      : '<tr><td colspan="5"><div class="empty-msg">Nenhum usuário.</div></td></tr>';
    return '<section class="tab-section"><div class="section-head"><h2>Usuários</h2><div class="toolbar"><button class="btn btn-primary" data-action="open-usuario-new">+ Novo usuário</button></div></div>'+
      '<div class="hint-box">Os usuários são compartilhados com o <strong>Controle de EPI</strong>. Desativar alguém aqui também bloqueia o acesso ao app de EPI.</div>'+
      '<div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'+
      '<section class="tab-section"><div class="section-head"><h2>Backup e permissões</h2></div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><button class="btn btn-secondary" data-action="baixar-backup">Baixar backup (.json)</button></div>'+
      '<div class="hint">Se aparecer "sem permissão" ao salvar, libere as coleções deste app nas regras do Firestore (console do Firebase → Firestore → Regras), junto das regras que já existem:</div>'+
      '<pre style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:.8rem;overflow:auto;margin-top:8px">match /emb_base/{doc} { allow read, write: if request.auth != null; }\nmatch /emb_importacoes/{doc} { allow read, write: if request.auth != null; }\nmatch /emb_contagens/{doc} { allow read, write: if request.auth != null; }</pre></section>';
  }
  function baixarBackup(){
    try{
      var json = JSON.stringify({geradoEm:new Date().toISOString(), base:state.base, importacoes:state.importacoes, contagens:state.contagens}, null, 2);
      var url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
      var a=document.createElement('a'); a.href=url; a.download='backup-estoque-embalagens-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }catch(e){ alert('Não foi possível gerar o backup agora.'); }
  }

  /* ================= Eventos ================= */
  function setFilter(path, val){ var p=path.split('.'); state.filters[p[0]][p[1]]=val; render(); }
  function wireEvents(){
    document.addEventListener('click', function(e){
      var el = e.target.closest('[data-action]'); if(!el) return;
      var a = el.getAttribute('data-action');
      if(a==='set-tab'){ state.tab=el.getAttribute('data-tab'); render(); window.scrollTo(0,0); }
      else if(a==='logout') logout();
      else if(a==='retry-connection'){ location.reload(); }
      else if(a==='pick-file'){ document.getElementById('file-xlsx').click(); }
      else if(a==='salvar-importacao') salvarImportacao();
      else if(a==='cancelar-preview'){ state.preview=null; render(); }
      else if(a==='ver-kardex'){ state.filters.mov = {q:'', unidade:el.getAttribute('data-u'), tipo:'todos', ini:'', fim:'', codigo:el.getAttribute('data-c')}; state.tab='movimentacoes'; render(); window.scrollTo(0,0); }
      else if(a==='limpar-mov'){ state.filters.mov = {q:'', unidade:'todas', tipo:'todos', ini:'', fim:'', codigo:''}; render(); }
      else if(a==='ir-contagem'){ state.contagem.data=todayISO(); state.contagem.unidade=el.getAttribute('data-u'); state.tab='contagem'; render(); window.scrollTo(0,0); }
      else if(a==='abrir-contagem'){ state.contagem.data=el.getAttribute('data-data'); state.contagem.unidade=el.getAttribute('data-u'); render(); window.scrollTo(0,0); }
      else if(a==='salvar-contagem') salvarContagem();
      else if(a==='export-estoque') exportEstoque();
      else if(a==='export-contagem') exportContagem();
      else if(a==='export-mov') exportMov();
      else if(a==='export-coop') exportCoop();
      else if(a==='open-usuario-new'){ document.getElementById('form-usuario').reset(); document.getElementById('dlg-usuario').showModal(); }
      else if(a==='close-dialog'){ document.getElementById(el.getAttribute('data-dlg')).close(); }
      else if(a==='toggle-usuario-ativo') toggleUsuarioAtivo(el.getAttribute('data-id'));
      else if(a==='reset-senha') resetSenhaUsuario(el.getAttribute('data-email'));
      else if(a==='baixar-backup') baixarBackup();
    });
    document.addEventListener('input', function(e){
      var t=e.target;
      if(t.hasAttribute('data-count')){ atualizarLinhaContagem(t.getAttribute('data-count'), t.value); return; }
      if(t.hasAttribute('data-cnt-obs')){ var c=state.contagem, id=contagemId(c.data,c.unidade); draftFor(id); state.draftObs[id]=t.value; state.draft[id].__salvo=false; return; }
      if(t.getAttribute('data-cnt')==='q'){ state.contagem.q=t.value; render(); return; }
      if(t.hasAttribute('data-filter') && t.tagName==='INPUT' && t.type!=='date'){ setFilter(t.getAttribute('data-filter'), t.value); }
    });
    document.addEventListener('change', function(e){
      var t=e.target;
      if(t.id==='file-xlsx'){ lerArquivo(t.files && t.files[0]); t.value=''; return; }
      var cnt=t.getAttribute('data-cnt');
      if(cnt==='data' || cnt==='unidade'){
        var c=state.contagem, d=state.draft[contagemId(c.data,c.unidade)];
        if(d && d.__salvo===false && !confirm('Há quantidades digitadas e não salvas nesta contagem. Trocar mesmo assim? (elas continuam guardadas nesta tela até você recarregar a página)')){ render(); return; }
        if(cnt==='data' && t.value) c.data=t.value; if(cnt==='unidade') c.unidade=t.value;
        render(); return;
      }
      if(t.hasAttribute('data-filter') && (t.tagName==='SELECT' || t.type==='date')) setFilter(t.getAttribute('data-filter'), t.value);
    });
    document.addEventListener('keydown', function(e){
      if(e.key==='Enter' && e.target.classList && e.target.classList.contains('count-input')){
        e.preventDefault();
        var all=[].slice.call(document.querySelectorAll('.count-input')), i=all.indexOf(e.target);
        if(all[i+1]){ all[i+1].focus(); all[i+1].select(); }
      }
    });
    ['dragover','dragenter'].forEach(function(ev){ document.addEventListener(ev, function(e){ var dz=document.getElementById('dropzone'); if(dz){ e.preventDefault(); dz.classList.add('over'); } }); });
    ['dragleave','drop'].forEach(function(ev){ document.addEventListener(ev, function(e){ var dz=document.getElementById('dropzone'); if(dz) dz.classList.remove('over'); }); });
    document.addEventListener('drop', function(e){
      if(!document.getElementById('dropzone')) return;
      e.preventDefault();
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) lerArquivo(f);
    });
    document.addEventListener('submit', function(e){
      if(e.target.id==='form-login'){ e.preventDefault(); attemptLogin(document.getElementById('l-email').value.trim(), document.getElementById('l-senha').value); }
      else if(e.target.id==='form-setup'){ e.preventDefault(); attemptSetup(document.getElementById('s-nome').value.trim(), document.getElementById('s-email').value.trim(), document.getElementById('s-senha').value, document.getElementById('s-senha2').value); }
    });
    document.getElementById('form-usuario').addEventListener('submit', async function(ev){
      ev.preventDefault();
      var s1=document.getElementById('u-senha').value, s2=document.getElementById('u-senha2').value;
      if(s1!==s2){ alert('As senhas não coincidem.'); return; }
      var ok = await createUsuarioAdmin({nome:document.getElementById('u-nome').value.trim(), email:document.getElementById('u-email').value.trim(), senha:s1, papel:document.getElementById('u-papel').value});
      if(ok) document.getElementById('dlg-usuario').close();
    });
    window.addEventListener('beforeunload', function(e){
      var pend = Object.keys(state.draft).some(function(k){ return state.draft[k].__salvo===false; });
      if(pend){ e.preventDefault(); e.returnValue=''; }
    });
  }
